# Co-occurrence (BiCM) only. A case-platform edge is dropped when every sentence naming that
# platform in the case matches one of these app-list boilerplate patterns (case-insensitive).
# Edges with any other sentence naming the platform are kept. Used by numbers/cooc/build_variants.py.
version: cooc-boilerplate-1
patterns:
  - id: fresno_common_apps
    regex: 'Common apps used by suspects include'
    seen_in: FRESNO SO, SVICAC press releases
  - id: nj_past_cases
    regex: 'In past cases, the ICAC Task Force has (?:made arrests of|arrested)'
    seen_in: NJ AG press releases
  - id: nj_gaming_apps
    regex: 'Arrests also have been made involving the gaming apps'
    seen_in: NJ AG press releases
