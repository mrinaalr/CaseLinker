# Platform registry for the AfH 2.0 Q1 manifest. Version bump on any edit.
#
# status
#   specific        a named product or service                      -> strict and broad eligibility
#   technology      a technology class, not one product ("Gen AI")  -> broad only, reported separately
#   generic         a bare category ("social media", "chat")        -> broad only
#   ambiguous_alias the label's matcher also catches other things   -> broad only, flagged
#   excluded        no platform information ("online", "internet")  -> never eligible
#
# capabilities: class -> first year the capability existed natively on the product
# (and `until` when it ended). Classes: anonymity, ephemerality, contact_discovery,
# unmonitored_communication, distribution_infrastructure, generative_synthesis.
# "Native" means a built-in feature, not a workaround. A class missing from the
# list means not native (e.g. WhatsApp anonymity: a phone number is required).
#
# basis: every year below is compiled from widely reported product history, at
# year precision, without a primary citation. All rows are needs_author_check
# until an author confirms or corrects them. Capability rows never count as
# evidence that an offender used the capability.
version: platforms-1
basis_default: needs_author_check

platforms:
  online:            {status: excluded}
  internet:          {status: excluded}
  social media:      {status: generic, family: social}
  chat:              {status: generic, family: messaging}
  Webcam platform:   {status: ambiguous_alias, family: video, note: "label covers any webcam/cam-site mention incl. MyFreeCams"}
  Gen AI:            {status: technology, family: ai, capabilities: {generative_synthesis: 2017}, note: "GAN face-swap ~2017; diffusion image models 2022"}
  Mega.nz:           {status: ambiguous_alias, family: file_hosting, launched: 2013, capabilities: {distribution_infrastructure: 2013, anonymity: 2013}, note: "alias 'mega' also matches unrelated words; verify sample"}

  Kik:               {status: specific, family: messaging, launched: 2010, capabilities: {anonymity: 2010, unmonitored_communication: 2010, distribution_infrastructure: 2010, contact_discovery: 2010}, note: "username-only signup, no phone number; public groups searchable from ~2016"}
  Snapchat:          {status: specific, family: messaging, launched: 2011, capabilities: {ephemerality: 2011, unmonitored_communication: 2011, distribution_infrastructure: 2013, contact_discovery: 2017, anonymity: 2011}, note: "disappearing snaps from launch; Stories 2013; Quick Add ~2017"}
  Discord:           {status: specific, family: messaging, launched: 2015, capabilities: {anonymity: 2015, unmonitored_communication: 2015, distribution_infrastructure: 2015, contact_discovery: 2015}}
  WhatsApp:          {status: specific, family: messaging, launched: 2009, capabilities: {unmonitored_communication: 2009, distribution_infrastructure: 2011, ephemerality: 2020}, note: "phone number required; disappearing messages Nov 2020; E2E 2016"}
  Telegram:          {status: specific, family: messaging, launched: 2013, capabilities: {unmonitored_communication: 2013, ephemerality: 2013, anonymity: 2013, distribution_infrastructure: 2015, contact_discovery: 2015}, note: "secret chats with self-destruct 2013; channels 2015; usernames hide phone"}
  Facebook Messenger: {status: specific, family: messaging, launched: 2008, capabilities: {unmonitored_communication: 2008, ephemerality: 2016}, note: "Facebook Chat 2008, app 2011; secret conversations timer 2016; vanish mode 2020"}
  Skype:             {status: specific, family: messaging, launched: 2003, until: 2025, capabilities: {unmonitored_communication: 2003, anonymity: 2003, contact_discovery: 2003}}
