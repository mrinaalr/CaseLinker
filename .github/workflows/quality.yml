name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "proposal/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Select Python
        run: uv python install 3.12

      - name: Install locked core and quality environment
        run: uv sync --locked --no-extra ml

      - name: Validate authored files and Python syntax
        run: uv run --locked --no-extra ml python scripts/quality/check_repository.py

      - name: Validate proposal milestone traceability
        run: uv run --locked --no-extra ml python scripts/quality/check_traceability.py

      - name: Lint strict proposal surface
        run: >-
          uv run --locked --no-extra ml ruff check
          scripts/quality scripts/run/claim_pipeline.py scripts/run/snapshot_manifest.py
          src/caselinker tests

      - name: Verify formatting on strict proposal surface
        run: >-
          uv run --locked --no-extra ml ruff format --check
          scripts/quality scripts/run/claim_pipeline.py scripts/run/snapshot_manifest.py
          src/caselinker tests

      - name: Type-check strict proposal surface
        run: >-
          uv run --locked --no-extra ml mypy
          scripts/quality/check_repository.py scripts/quality/check_traceability.py
          scripts/run/claim_pipeline.py src/caselinker

      - name: Run fast tests with coverage
        run: >-
          uv run --locked --no-extra ml pytest
          tests/quality tests/unit tests/integration tests/contract
          --cov=scripts/quality --cov=src/caselinker
          --cov-report=term-missing

      - name: Reproduce and verify the policy-safe snapshot fixture
        run: |
          set -euo pipefail
          uv run --locked --no-extra ml python scripts/run/snapshot_manifest.py \
            build --spec data/manifests/example.snapshot-spec.json \
            --output /tmp/caselinker-example-1.snapshot.json
          uv run --locked --no-extra ml python scripts/run/snapshot_manifest.py \
            build --spec data/manifests/example.snapshot-spec.json \
            --output /tmp/caselinker-example-2.snapshot.json
          cmp /tmp/caselinker-example-1.snapshot.json /tmp/caselinker-example-2.snapshot.json
          uv run --locked --no-extra ml python scripts/run/snapshot_manifest.py \
            verify --manifest /tmp/caselinker-example-1.snapshot.json

  application-smoke:
    name: Application smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Select Python
        run: uv python install 3.12

      - name: Install locked core environment
        run: uv sync --locked --no-extra ml

      - name: Boot the API contract
        env:
          CASELINKER_DISABLE_MCP: "1"
        run: uv run --locked pytest -m smoke tests/smoke

      - name: Audit the locked core environment
        run: uv run --locked pip-audit --local --skip-editable

      - name: Scan strict proposal Python for high-severity findings
        run: >-
          uv run --locked bandit -q -lll -r
          scripts/quality scripts/run/claim_pipeline.py scripts/run/snapshot_manifest.py
          src/caselinker
