<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>State machines · CaseLinker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/viz-assets/v4.css?v=4.1">
  <script src="/viz-assets/v4.js?v=4.2" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/viz-assets/lifecycle.css">
</head>
<body class="lifecycle-page">
  <div id="cl-nav" data-active="lifecycle"></div>

  <div class="cl-page cl-page--wide">
    <header class="cl-head">
      <h1 class="cl-title">State machines</h1>
      <span class="cl-lede" id="lede"></span>
      <span class="cl-head__spacer"></span>
      <span id="release-banner" class="release-banner" hidden></span>
    </header>

    <div class="tabs" id="view-tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" data-view="documented" aria-selected="true">Documented</button>
      <button type="button" role="tab" data-view="theory" aria-selected="false">Theory</button>
    </div>

    <section class="lifecycle-section" id="view-documented" aria-labelledby="doc-heading">
      <header class="lifecycle-section-head">
        <h2 class="lifecycle-h2" id="doc-heading">What the record shows</h2>
        <p class="lifecycle-sub">Federal court records, expressed as actions in their documented order.</p>
      </header>
      <div id="doc-canvas" class="cl-canvas lifecycle-canvas" role="img" aria-label="Documented trajectories, one lane per case">
        <div class="lifecycle-loading">Loading documented trajectories…</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="lifecycle-section" id="view-theory" aria-labelledby="th-heading" hidden>
      <header class="lifecycle-section-head">
        <h2 class="lifecycle-h2" id="th-heading">The formal model</h2>
        <p class="lifecycle-sub"><em>Affordances for Harm</em>, §7.2 and Appendix X.</p>
      </header>
      <div id="theory" class="theory"></div>
    </section>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" aria-hidden="true"></div>
  <aside id="detail-panel" class="detail-panel cl-card" aria-label="Event detail" aria-hidden="true"></aside>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="/viz-assets/lifecycle.js"></script>
</body>
</html>
