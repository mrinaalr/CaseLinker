        .src-toolbar .cl-input { max-width: 340px; }
        .src-toolbar .cl-select { width: auto; min-width: 180px; }
        .src-toolbar__status { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

        .src-card { display: flex; flex-direction: column; min-width: 0; }
        .src-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 18px 0; }
        .src-card__name { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.25; letter-spacing: -.01em; margin: 0; min-width: 0; }
        .src-card__name a { color: var(--ink); }
        .src-card__name a:hover { color: var(--accent); }
        .src-card__count { flex: none; text-align: right; font-family: var(--serif); font-size: 24px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
        .src-card__count small { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
        .src-card__count.is-pending { color: var(--ink-4); }
        .src-card__count.is-zero { color: var(--ink-3); }
        .src-card__body { padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .src-card__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
        .src-card__meta .cl-chip { font-size: 11.5px; padding: 2px 8px; }
        .src-card__desc { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2);
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .src-card__range { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .src-card__range b { font-weight: 500; color: var(--ink-2); }
        .src-card__years { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); }
        .src-card__years a.cl-chip { color: var(--ink-2); font-variant-numeric: tabular-nums; text-decoration: none; transition: border-color .15s var(--ease), color .15s var(--ease); }
        .src-card__years a.cl-chip:hover { border-color: var(--accent); color: var(--accent); }
        .src-card__years a.cl-chip .n { color: var(--ink-3); font-weight: 400; }
        .src-card__host { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); word-break: break-all; }
        .src-card__host a { color: var(--ink-3); }
        .src-card__host a:hover { color: var(--accent); }
        @media (max-width: 640px) {
            .src-toolbar .cl-input { max-width: none; }
            .src-toolbar .cl-select { width: 100%; }

            // Combine the aggregate rows for a list of source keys.
            function sumKeys(stats, keys) {
                let count = 0, min = null, max = null;
                keys.forEach(k => {
                    const e = stats.sources[k];
                    if (!e) return;
                    count += e.count || 0;
                    if (e.min_year != null) min = min == null ? e.min_year : Math.min(min, e.min_year);
                    if (e.max_year != null) max = max == null ? e.max_year : Math.max(max, e.max_year);
                });
                return { count, min, max };
            }

                staticSources.forEach(s => {

                    const [, keys, opts = {}] = rule;
                    const agg = sumKeys(stats, keys);
                    s.caseCount = agg.count;
                    s.yearMin = agg.min;
                    s.yearMax = agg.max;
                    s.dateRangeDisplay = yearSpan(agg.min, agg.max);
                    const yl = s.yearLinks || [];

                    if (!yl.length) return;
                    if (!opts.keepYear && s.dateRangeDisplay) yl[0].year = s.dateRangeDisplay;
                    if (!opts.noCount) yl[0].casesUsed = agg.count;
                });
            }

            // Last good aggregate, so a revisit paints final numbers in the first frame.
            const SOURCES_STATS_KEY = 'caselinker_sources_stats_v1';
            let cachedStats = null;
            try {
                const raw = localStorage.getItem(SOURCES_STATS_KEY);
                const parsed = raw ? JSON.parse(raw) : null;
                if (parsed && parsed.sources && typeof parsed.case_count === 'number') cachedStats = parsed;
            } catch (e) { /* ignore */ }

            if (cachedStats) {
                applySourceStats(cachedStats);
                displaySources(staticSources);
            } else {
                displaySources(staticSources, { pending: true });
            }

            // Refresh from the aggregate endpoint; repaint only when the numbers changed.
            try {
                const r = await fetch('/api/sources-stats');
                if (!r.ok) throw new Error('sources-stats ' + r.status);
                const fresh = await r.json();
                const freshJson = JSON.stringify({ c: fresh.case_count, s: fresh.sources });
                const cachedJson = cachedStats ? JSON.stringify({ c: cachedStats.case_count, s: cachedStats.sources }) : null;
                try { localStorage.setItem(SOURCES_STATS_KEY, JSON.stringify(fresh)); } catch (e) { /* ignore */ }
                if (freshJson !== cachedJson) {
                    applySourceStats(fresh);
                    displaySources(staticSources);
                }
            } catch (error) {
                console.error('Error loading sources:', error);
                if (!cachedStats) displaySources(staticSources, { error: String(error && error.message || error) });
            }
        }

        // ---- Presentation (shared shell chrome). Counting logic above is untouched; this only renders it. ----
        const srcEsc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const srcFmt = (n) => (typeof n === 'number' && Number.isFinite(n)) ? n.toLocaleString('en-US') : String(n);
        const srcState = { sources: [], options: {}, typesReady: false };
        const yearSpan = (min, max) => min == null ? null : (min === max ? `${min}` : `${min}-${max}`);

        function srcHost(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
        }

        function srcInitTypes(sources) {
            if (srcState.typesReady) return;
            const sel = document.getElementById('src-type');
            if (!sel) return;
            const seen = new Map();
            sources.forEach(s => {
                if (!s.type) return;
                const key = String(s.type).trim().toLowerCase();
                if (!seen.has(key)) seen.set(key, String(s.type).trim());
            });
            [...seen.entries()].sort((a, b) => a[1].localeCompare(b[1])).forEach(([key, label]) => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = label.charAt(0).toUpperCase() + label.slice(1);
                sel.appendChild(opt);
            });
            srcState.typesReady = true;
            const rerender = () => renderSourceCards();
            sel.addEventListener('change', rerender);
            const filter = document.getElementById('src-filter');
            if (filter) filter.addEventListener('input', rerender);
        }

        function srcUpdateStats(sources, pending, totalCasesHint, error) {
            const set = (id, text, isPending) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.textContent = text;
                el.classList.toggle('is-pending', !!isPending);
            };
            set('stat-sources', srcFmt(sources.length), false);
            const eyebrow = document.getElementById('src-eyebrow');
            if (eyebrow) eyebrow.textContent = `SOURCES · ${sources.length} PUBLIC RECORD SETS`;
            if (pending) {
                set('stat-cases', totalCasesHint != null ? `…/${srcFmt(totalCasesHint)}` : '…', true);
                set('stat-agencies', '…', true);
                set('stat-span', '…', true);
                return;
            }
            const total = sources.reduce((n, s) => n + (s.caseCount || 0), 0);
            const withCases = sources.filter(s => (s.caseCount || 0) > 0).length;
            set('stat-cases', error ? '—' : srcFmt(total), false);
            set('stat-agencies', error ? '—' : `${srcFmt(withCases)} / ${srcFmt(sources.length)}`, false);
            const mins = sources.map(s => s.yearMin).filter(y => y != null);
            const maxs = sources.map(s => s.yearMax).filter(y => y != null);
            const span = mins.length ? yearSpan(Math.min(...mins), Math.max(...maxs)) : null;
            set('stat-span', span ? span.replace('-', '–') : '—', false);
        }

        function srcUpdateStatus(shown, total, pending, totalCasesHint, error) {
            const el = document.getElementById('src-status');
            if (!el) return;
            if (error) {
                el.textContent = `Counts unavailable: ${error}`;
            } else if (pending) {
                el.innerHTML = `<span class="cl-spinner" aria-hidden="true"></span> Loading ${totalCasesHint != null ? srcFmt(totalCasesHint) + ' ' : ''}case summaries…`;
            } else if (shown === total) {
                el.textContent = `${srcFmt(total)} sources, sorted by case count`;
            } else {
                el.textContent = `${srcFmt(shown)} of ${srcFmt(total)} sources`;
            }
        }

        function displaySources(sources, options = {}) {
            srcState.sources = sources;
            srcState.options = options;
            srcInitTypes(sources);
            const pending = options.pending === true;
            srcUpdateStats(sources, pending, options.totalCasesHint, options.error);
            if (options.error) {
                const notices = document.querySelector('.src-notices');
                if (notices && !document.getElementById('src-error')) {
                    const n = document.createElement('div');
                    n.className = 'cl-notice cl-notice--danger';
                    n.id = 'src-error';
                    n.setAttribute('role', 'alert');
                    n.innerHTML = `<div><strong>Live counts could not be loaded.</strong> The registry below is complete, but per-source case counts and date ranges are unavailable until the store responds (${srcEsc(options.error)}). Reload to retry.</div>`;
                    notices.appendChild(n);
                }
            }
            renderSourceCards();
        }

        function renderSourceCards() {
            const sources = srcState.sources;
            const options = srcState.options;
            const pending = options.pending === true;
            const totalCasesHint = options.totalCasesHint;
            const container = document.getElementById('source-list');

            if (sources.length === 0) {
                container.innerHTML = '<div class="cl-empty">No sources found.</div>';
                srcUpdateStatus(0, 0, pending, totalCasesHint, options.error);
                return;
            }

            const q = (document.getElementById('src-filter')?.value || '').trim().toLowerCase();
            const typeKey = (document.getElementById('src-type')?.value || '').trim().toLowerCase();

            // Original registry order while counts are pending; by case count (desc, stable) once they arrive.
            let ordered = sources.map((s, i) => ({ s, i }));
            if (!pending) {
                ordered.sort((a, b) => {
                    const ca = a.s.caseCount || 0;
                    const cb = b.s.caseCount || 0;
                    return (cb - ca) || (a.i - b.i);
                });
            }
            const visible = ordered.map(o => o.s).filter(source => {
                if (q && !String(source.name || '').toLowerCase().includes(q)) return false;
                if (typeKey && String(source.type || '').trim().toLowerCase() !== typeKey) return false;
                return true;
            });

            srcUpdateStatus(visible.length, sources.length, pending, totalCasesHint, options.error);

            if (visible.length === 0) {
                container.innerHTML = `<div class="cl-empty" style="grid-column:1/-1">No sources match “${srcEsc(q)}”${typeKey ? ' in that type' : ''}.</div>`;
                return;
            }

            container.innerHTML = visible.map(source => {
                const caseCount = source.caseCount || 0;
                const dateRange = source.dateRangeDisplay || null;

                let countHtml;
                if (pending) {
                    countHtml = `<div class="src-card__count is-pending" title="Counting…">…<small>cases</small></div>`;
                } else if (options.error) {
                    countHtml = `<div class="src-card__count is-zero" title="Counts unavailable">—<small>cases</small></div>`;
                } else {
                    countHtml = `<div class="src-card__count${caseCount === 0 ? ' is-zero' : ''}">${srcFmt(caseCount)}<small>${caseCount === 1 ? 'case' : 'cases'}</small></div>`;
                }

                const yearPills = source.yearLinks ? source.yearLinks.map(yl => {
                    const casesUsed = yl.casesUsed !== undefined ? yl.casesUsed : 0;
                    const totalAvailable = yl.totalAvailable !== undefined ? yl.totalAvailable : null;
                    let countText = '';
                    if (pending) {
                        countText = totalAvailable !== null
                            ? ` (…/${totalAvailable})`
                            : (totalCasesHint != null && !Number.isNaN(totalCasesHint)
                                ? ` (…/${totalCasesHint})`
                                : ' (…)');
                    } else if (totalAvailable !== null) {
                        countText = ` (${casesUsed}/${totalAvailable})`;
                    } else if (casesUsed > 0) {
                        countText = ` (${casesUsed} cases)`;
                    }
                    return `<a class="cl-chip cl-chip--line" href="${srcEsc(yl.url)}" target="_blank" rel="noopener noreferrer" title="${srcEsc(yl.year)}${srcEsc(countText)}">${srcEsc(yl.year)}${countText ? `<span class="n">${srcEsc(countText)}</span>` : ''}</a>`;
                }).join('') : '';

                return `
                    <article class="cl-card src-card">
                        <div class="src-card__head">
                            <h3 class="src-card__name">${source.url
                                ? `<a href="${srcEsc(source.url)}" target="_blank" rel="noopener noreferrer">${srcEsc(source.name)}</a>`
                                : srcEsc(source.name)}</h3>
                            ${countHtml}
                        </div>
                        <div class="src-card__body">
                            <div class="src-card__meta">
                                ${source.url ? `<span class="src-card__host"><a href="${srcEsc(source.url)}" target="_blank" rel="noopener noreferrer">${srcEsc(srcHost(source.url))}</a></span>` : ''}
                            </div>
                            ${source.description ? `<p class="src-card__desc" title="${srcEsc(source.description)}">${srcEsc(source.description)}</p>` : ''}
                            ${dateRange ? `<div class="src-card__range">Date range <b>${srcEsc(String(dateRange).replace('-', '–'))}</b></div>`
                                : (pending ? `<div class="src-card__range">Date range <b class="cl-muted">…</b></div>` : '')}
                            ${yearPills ? `<div class="src-card__years">${yearPills}</div>` : ''}
                        </div>
                    </article>
                `;
            }).join('');
        }


        loadSources();
    </script>
    
</body>
</html>
