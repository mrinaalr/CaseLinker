<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis · CaseLinker</title>
  <meta name="description" content="Ask a question in plain language. CaseLinker turns it into a SPARQL query over the CAC/UCO case graphs, answers it, and shows the source passages behind the answer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/viz-assets/v4.css?v=4.1">
  <script src="/viz-assets/caselinker-api.js"></script>
  <script src="/viz-assets/v4.js?v=4.2" defer></script>
  <style>
    .ask-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-1); padding: 12px 14px 10px; }
    .ask-box:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(46,107,184,.12); }
    .ask-box textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.4; color: var(--ink); min-height: 44px; padding: 0; }
    .ask-box textarea::placeholder { color: var(--ink-4); }
    .ask-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .ask-row .hint { font-size: 12.5px; color: var(--ink-3); }
    .ask-row .method { font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
    .ask-row .method b { color: var(--danger); font-weight: 400; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .examples button { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; text-align: left; line-height: 1.3; transition: border-color .15s, color .15s; }
    .examples button:hover { border-color: var(--ink-4); color: var(--ink); }

    .trace { margin-top: 20px; display: grid; gap: 0; position: relative; }
    .step { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 20px; padding: 16px 0; border-top: 1px solid var(--line); }
    .step:last-child { border-bottom: 1px solid var(--line); }
    .step__k { position: sticky; top: calc(var(--nav-h) + 16px); align-self: start; }
    .step__n { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
    .step__t { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .step__s { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }
    .step[hidden] { display: none; }
    @media (max-width: 760px) { .step { grid-template-columns: 1fr; gap: 10px; } .step__k { position: static; } }

    .sparql { position: relative; }
    .sparql textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #fcfbf8; color: var(--ink); resize: vertical; min-height: 160px; outline: none; }
    .sparql textarea:focus { border-color: var(--accent-2); }
    .sparql__bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .sparql__bar .grow { flex: 1; }

    .answer-kicker { font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; margin-bottom: 12px; }
    .answer-kicker b { font-weight: 500; }
    .result-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .result-wrap table td button.case { font-family: var(--mono); font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
    .result-wrap table td button.case:hover { text-decoration: underline; }
    .result-wrap table td button.case.is-on { font-weight: 600; color: var(--ink); }
    .rowtools { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
    .rowtools a, .rowtools button { font-size: 11.5px; padding: 0; border: 0; background: none; color: var(--ink-4); cursor: pointer; }
    .rowtools a:hover, .rowtools button:hover { color: var(--accent); text-decoration: none; }
    .case-sum { display: grid; gap: 8px; }
    .case-sum__row { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 12px; align-items: start; }
    .case-sum__k { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-top: 4px; }
    .case-sum__v { display: flex; flex-wrap: wrap; gap: 6px; }
    .step--query .sparql__bar { margin-top: 8px; }
    .step--query .step__s { font-size: 12px; }
    .rowtools button.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }

    .ev-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .ev-head .cl-id { font-size: 15px; color: var(--ink); }
    .ev-links { display: flex; gap: 12px; font-size: 13px; }
    .ev-group { margin-bottom: 20px; }
    .ev-group h4 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .ev-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
    .ev-item:first-of-type { border-top: 0; }
    .ev-item .cl-quote { font-size: 15.5px; }
    .ev-meta { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; text-align: right; line-height: 1.6; }
    .ev-meta b { color: var(--ink-2); font-weight: 500; }
    .ev-value { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
    .ev-value code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
    .ev-item[data-span] { cursor: pointer; border-radius: 6px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; transition: background .12s var(--ease); }
    .ev-item[data-span]:hover { background: var(--surface-2); }
    .ev-item[data-span].is-on { background: var(--accent-soft); }
    .ev-item[data-span].is-on .cl-quote { border-left-color: var(--accent); }
    .ev-layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(320px, 46%); gap: 20px; align-items: start; }
    .ev-layout .cl-narrative { position: sticky; top: calc(var(--nav-h) + 16px); }
    .ev-layout .cl-narrative__body { max-height: calc(100vh - var(--nav-h) - 100px); }
    @media (max-width: 1000px) { .ev-layout { grid-template-columns: 1fr; } .ev-layout .cl-narrative { position: static; } .ev-layout .cl-narrative__body { max-height: 420px; } }
    .ev-details > summary { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .ev-details[open] > summary { border-radius: 8px 8px 0 0; }
    .ev-details > #evidence { padding: 14px 0 0; }
    .answer-note { font-size: 14px; color: var(--ink-2); margin: -4px 0 14px; max-width: 70ch; }
    .answer-note b { font-weight: 600; color: var(--ink); }

    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
    .pill-src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div id="cl-nav" data-active="analysis"></div>

  <main class="cl-page" style="max-width: 1040px;">
    <header class="cl-head">
      <h1 class="cl-title">Analysis</h1>
    </header>

    <section class="ask-box" aria-label="Question">
      <label class="cl-sr" for="q">Your question</label>
      <textarea id="q" rows="2" placeholder="Which platform did the CyberTip in this Maryland case come from, and which source passage supports it?"></textarea>
      <div class="ask-row">
        <div class="cl-toolbar">
          <span class="method">Question <b>→</b> SPARQL over graph store <b>→</b> answers, with the passages behind them</span>
        </div>
        <div class="cl-toolbar">
          <span class="hint"><span class="cl-kbd">⌘</span> + <span class="cl-kbd">↵</span></span>
          <button class="cl-btn cl-btn--primary" id="ask">Ask</button>
        </div>
      </div>
      <div class="examples" id="examples" aria-label="Example questions"></div>
    </section>

    <section class="trace" id="trace" aria-live="polite">
      <div class="step step--query" id="s-query" hidden>
        <div class="step__k"><div class="step__n">Step 1</div><div class="step__t">Query</div><div class="step__s" id="query-how"></div></div>
        <div>
          <details class="cl-details" id="query-details">
            <summary>SPARQL</summary>
            <div class="sparql" style="margin-top:10px">
              <textarea id="sparql" spellcheck="false" aria-label="SPARQL query"></textarea>
            </div>
          </details>
          <div class="sparql__bar">
            <button class="cl-btn cl-btn--sm" id="run">Run</button>
            <button class="cl-btn cl-btn--sm cl-btn--ghost" id="copy-sparql">Copy</button>
            <a class="cl-btn cl-btn--sm cl-btn--ghost" id="open-graph" href="/patterns">Open in Graph</a>
            <span class="grow"></span>
            <span class="status" id="query-status"></span>
          </div>
        </div>
      </div>

      <div class="step" id="s-answer" hidden>
        <div class="step__k"><div class="step__n">Step 2</div><div class="step__t">Answer</div><div class="step__s" id="answer-how"></div></div>
        <div id="answer"></div>
      </div>

      <div class="step" id="s-evidence" hidden>
        <div class="step__k"><div class="step__n">Step 3</div><div class="step__t">Passages</div><div class="step__s">Collapsed by default. Open to read the source text.</div></div>
        <details class="cl-details ev-details" id="evidence-details">
          <summary id="evidence-summary">Show passages</summary>
          <div id="evidence"></div>
        </details>
      </div>

    </section>
  </main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var PREFIXES =
    'PREFIX cac: <https://cacontology.projectvic.org#>\n' +
    'PREFIX cac-multi: <https://cacontology.projectvic.org/multi-jurisdiction#>\n' +
    'PREFIX ncmec: <https://cacontology.projectvic.org/us/ncmec#>\n' +
    'PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n' +
    'PREFIX dcterms: <http://purl.org/dc/terms/>\n';
  var RES = 'https://w3id.org/caselinker/resource/';
  var PRESS = 'FILTER(STRSTARTS(STR(?g), "' + RES + 'case/") && !STRENDS(STR(?g), "/provenance"))';

  /* ---------- vocabulary for slot filling ---------- */
  var PLATFORMS = {"social media":"social-media","chat":"chat","Kik":"kik","Snapchat":"snapchat","Facebook":"facebook","Twitter / X":"twitter-x","Twitter":"twitter-x","X":null,"Instagram":"instagram","Dropbox":"dropbox","Discord":"discord","dark web":"dark-web","YouTube":"youtube","Gen AI":"gen-ai","generative AI":"gen-ai","Telegram":"telegram","Google Drive":"google-drive","WhatsApp":"whatsapp","webcam":"webcam-platform","Mega.nz":"meganz","Mega":"meganz","Facebook Messenger":"facebook-messenger","Messenger":"facebook-messenger","BitTorrent":"bittorrent","Reddit":"reddit","TikTok":"tiktok","Skype":"skype","Tumblr":"tumblr","iCloud":"icloud","Omegle":"omegle","Tor":"tor","IRC":"irc","Craigslist":"craigslist","Whisper":"whisper","Grindr":"grindr","cryptocurrency":"cryptocurrency","Wickr":"wickr","MeWe":"mewe","Xbox Live":"xbox-live","Xbox":"xbox-live","PlayStation":"playstation-network","Skout":"skout","LimeWire":"limewire","Kazaa":"kazaa","Roblox":"roblox","Minecraft":"minecraft","Fortnite":"fortnite","Twitch":"twitch","AOL":"aol-instant-messenger","OneDrive":"onedrive","Chat Avenue":"chat-avenue","MySpace":"myspace","Chatroulette":"chatroulette","Yubo":"yubo","Yahoo":"yahoo-chat","Steam":"steam","Oculus":"oculus","IMVU":"imvu","Gigatribe":"gigatribe","Stable Diffusion":"stable-diffusion","Monkey":"monkey"};
  var STATES = {"alabama":"al","alaska":"ak","arizona":"az","arkansas":"ar","california":"ca","colorado":"co","connecticut":"ct","delaware":"de","florida":"fl","georgia":"ga","hawaii":"hi","idaho":"id","illinois":"il","indiana":"in","iowa":"ia","kansas":"ks","kentucky":"ky","louisiana":"la","maine":"me","maryland":"md","massachusetts":"ma","michigan":"mi","minnesota":"mn","mississippi":"ms","missouri":"mo","montana":"mt","nebraska":"ne","nevada":"nv","new hampshire":"nh","new jersey":"nj","new mexico":"nm","new york":"ny","north carolina":"nc","north dakota":"nd","ohio":"oh","oklahoma":"ok","oregon":"or","pennsylvania":"pa","rhode island":"ri","south carolina":"sc","south dakota":"sd","tennessee":"tn","texas":"tx","utah":"ut","vermont":"vt","virginia":"va","washington":"wa","west virginia":"wv","wisconsin":"wi","wyoming":"wy","district of columbia":"dc"};

  function findPlatforms(q) {
    var out = [], lower = q.toLowerCase();
    Object.keys(PLATFORMS).sort(function (a, b) { return b.length - a.length; }).forEach(function (label) {
      var slug = PLATFORMS[label]; if (!slug) return;
      var re = new RegExp('(^|[^a-z0-9])' + label.toLowerCase().replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '($|[^a-z0-9])');
      if (re.test(lower) && out.every(function (o) { return o.slug !== slug; })) out.push({ label: label, slug: slug });
    });
    return out;
  }
  function findState(q) {
    var lower = q.toLowerCase(), best = null;
    Object.keys(STATES).forEach(function (name) { if (lower.indexOf(name) >= 0 && (!best || name.length > best.name.length)) best = { name: name, abbr: STATES[name] }; });
    if (!best) return null;
    return { label: best.name.replace(/\b\w/g, function (c) { return c.toUpperCase(); }), iri: RES + 'location/' + best.name.replace(/ /g, '-') + '-' + best.abbr };
  }
  function findCase(q) { var m = /\b([a-z]+(?:_[a-z]+)*_\d{4}_\d{3})\b/i.exec(q); return m ? m[1].toLowerCase() : null; }
  function caseIri(id) { return RES + 'case/' + id; }

  /* ---------- verified query templates ---------- */
  function build(q) {
    var lower = q.toLowerCase();
    var id = findCase(q), state = findState(q), plats = findPlatforms(q);
    var tip = /cyber\s?tip|tipline|ncmec report/.test(lower);
    var AG = { 'fbi': 'fbi', 'federal bureau of investigation': 'fbi', 'hsi': 'hsi', 'homeland security investigations': 'hsi', 'ncmec': 'ncmec', 'icac': 'icac', 'usao': 'usao', 'u.s. attorney': 'usao', 'marshals': 'usms', 'cbp': 'cbp', 'secret service': 'usss' };
    var ags = Object.keys(AG).filter(function (k) { return new RegExp('(^|[^a-z])' + k.replace(/\./g, '\\.') + '($|[^a-z])').test(lower); }).map(function (k) { return AG[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var count = /how many|count|number of/.test(lower);
    var agency = /agenc|task force|police|sheriff|fbi|hsi|department/.test(lower);
    var subject = /sentenc|prison|years in|probation/.test(lower) ? 'sentence' : /\bage|aged|how old|years old|year-old|\bold\b/.test(lower) ? 'age' : /\bdate|when\b|what year/.test(lower) ? 'date' : null;
    var wantPlatform = /platform|app|service|channel|where online|website|site/.test(lower) || plats.length > 0;

    var oneCase = PREFIXES + 'SELECT ?caseId WHERE { GRAPH <' + (id ? caseIri(id) : '') + '> { ?case a cac:CACInvestigation ; dcterms:identifier ?caseId } }';
    if (id && subject) return { how: 'Template: passages for one field in one case', kind: 'field', field: subject, casesSparql: oneCase, sparql: PREFIXES +
      'PREFIX oa: <http://www.w3.org/ns/oa#>\nPREFIX prov: <http://www.w3.org/ns/prov#>\nPREFIX cacc: <https://cacontology.projectvic.org/core#>\n' +
      'SELECT ?value ?quote ?start ?end ?confidence ?method WHERE {\n' +
      '  GRAPH <' + caseIri(id) + '/provenance> {\n' +
      '    ?a a oa:Annotation ; dcterms:subject "' + subject + '" ; prov:value ?value ; oa:hasTarget ?t .\n' +
      '    ?t oa:hasSelector ?qs . ?qs oa:exact ?quote .\n' +
      '    ?t oa:hasSelector ?ps . ?ps oa:start ?start ; oa:end ?end .\n' +
      '    OPTIONAL { ?a cacc:hasConfidence ?confidence } OPTIONAL { ?a cacc:usesMethod ?method }\n' +
      '  }\n} ORDER BY ?start LIMIT 50', evidenceCase: id };

    if (id && tip) return { casesSparql: oneCase, how: 'Template: the CyberTip step in one case (its reporting body and channel, if recorded) beside the platforms on the case\u2019s other steps', kind: 'cybertip', sparql: PREFIXES +
      'SELECT ?tip ?reporterLabel ?tipChannelLabel ?platform ?label (GROUP_CONCAT(DISTINCT ?stepName; separator=", ") AS ?steps) WHERE {\n' +
      '  GRAPH <' + caseIri(id) + '> {\n' +
      '    ?case a cac:CACInvestigation .\n' +
      '    OPTIONAL { ?case cac:hasStep ?tip . ?tip a ncmec:NCMECCybertipReport .\n' +
      '      OPTIONAL { ?tip ncmec:supportedBy ?reporter . ?reporter rdfs:label ?reporterLabel }\n' +
      '      OPTIONAL { ?tip cac:usesChannel ?tipChannel . ?tipChannel rdfs:label ?tipChannelLabel } }\n' +
      '    OPTIONAL { ?case cac:hasStep ?step . ?step cac:usesChannel ?platform . ?platform rdfs:label ?label .\n' +
      '      OPTIONAL { ?step a ?stepType FILTER(?stepType != <https://cacontology.projectvic.org/core#Event>) }\n' +
      '      BIND(REPLACE(STR(?stepType), "^.*[#/]", "") AS ?stepName) }\n' +
      '  }\n} GROUP BY ?tip ?reporterLabel ?tipChannelLabel ?platform ?label ORDER BY ?label LIMIT 50', evidenceCase: id };

    if (id && (wantPlatform || tip)) return { casesSparql: oneCase, how: 'Template: platforms used in one case, with the step they attach to', sparql: PREFIXES +
      'SELECT ?platform ?label (GROUP_CONCAT(DISTINCT ?stepName; separator=", ") AS ?steps) WHERE {\n' +
      '  GRAPH <' + caseIri(id) + '> {\n' +
      '    ?case a cac:CACInvestigation ; cac:hasStep ?step .\n' +
      '    ?step cac:usesChannel ?platform . ?platform rdfs:label ?label .\n' +
      '    OPTIONAL { ?step a ?stepType FILTER(?stepType != <https://cacontology.projectvic.org/core#Event>) }\n' +
      '    BIND(REPLACE(STR(?stepType), "^.*[#/]", "") AS ?stepName)\n' +
      '  }\n} GROUP BY ?platform ?label ORDER BY ?label LIMIT 50', evidenceCase: id };

    if (id && agency) return { casesSparql: oneCase, how: 'Template: agencies involved in one case', sparql: PREFIXES +
      'SELECT ?case ?agency ?label ?kind WHERE {\n' +
      '  GRAPH <' + caseIri(id) + '> {\n' +
      '    ?case a cac:CACInvestigation ; cac-multi:involvesAgency ?agency . ?agency rdfs:label ?label .\n' +
      '    OPTIONAL { ?agency a ?kind FILTER(CONTAINS(STR(?kind), "Agency") || CONTAINS(STR(?kind), "taskforce")) }\n' +
      '  }\n} ORDER BY ?label LIMIT 100', evidenceCase: id };

    if (id) return { casesSparql: oneCase, kind: 'case', how: 'Template: what the case graph records about this investigation', sparql: PREFIXES +
      'SELECT ?kind ?label ?node WHERE {\n  GRAPH <' + caseIri(id) + '> {\n    BIND(<' + caseIri(id) + '> AS ?case)\n    {\n      ?case cac:hasStep ?node . ?node a ?t FILTER(?t != <https://cacontology.projectvic.org/core#Event>)\n      BIND("step" AS ?kind) BIND(REPLACE(STR(?t), "^.*[#/]", "") AS ?label)\n    } UNION {\n      ?case cac:hasStep ?s . ?s cac:usesChannel ?node . ?node rdfs:label ?label BIND("platform" AS ?kind)\n    } UNION {\n      ?case cac-multi:involvesAgency ?node . ?node rdfs:label ?label BIND("agency" AS ?kind)\n    } UNION {\n      ?case dcterms:spatial ?node . ?node rdfs:label ?label BIND("location" AS ?kind)\n    } UNION {\n      ?case dcterms:source ?node FILTER(isLiteral(?node)) BIND("source" AS ?kind) BIND(STR(?node) AS ?label)\n    }\n  }\n} ORDER BY ?kind ?label LIMIT 300', evidenceCase: id };

    var where = '    ?case a cac:CACInvestigation ; dcterms:identifier ?caseId .\n';
    if (state) where += '    ?case dcterms:spatial <' + state.iri + '> .\n';
    if (tip) where += '    ?case cac:hasStep ?tip . ?tip a ncmec:NCMECCybertipReport .\n';
    plats.forEach(function (p, i) { where += '    ?case cac:hasStep ?e' + i + ' . ?e' + i + ' cac:usesChannel <' + RES + 'platform/' + p.slug + '> .\n'; });
    ags.forEach(function (a) { where += '    ?case cac-multi:involvesAgency <' + RES + 'agency/' + a + '> .\n'; });
    var casesQ = PREFIXES + 'SELECT DISTINCT ?caseId WHERE {\n  GRAPH ?g {\n' + where + '  }\n  ' + PRESS + '\n} ORDER BY ?caseId LIMIT 500';
    var desc = [state ? state.label : null, tip ? 'CyberTip' : null].concat(plats.map(function (p) { return p.label; })).concat(ags.map(function (a) { return a.toUpperCase(); })).filter(Boolean).join(' · ');

    if (agency && (state || plats.length || tip || ags.length)) return { casesSparql: casesQ, how: 'Template: agencies by number of cases' + (desc ? ' (' + desc + ')' : ''), sparql: PREFIXES +
      'SELECT ?label (COUNT(DISTINCT ?case) AS ?cases) WHERE {\n  GRAPH ?g {\n' + where +
      '    ?case cac-multi:involvesAgency ?agency . ?agency rdfs:label ?label .\n  }\n  ' + PRESS + '\n} GROUP BY ?label ORDER BY DESC(?cases) LIMIT 25' };

    if (wantPlatform && (count || !state) && !(state && !count)) return { casesSparql: casesQ, how: 'Template: platforms by number of cases' + (desc ? ' (' + desc + ')' : ''), sparql: PREFIXES +
      'SELECT ?label (COUNT(DISTINCT ?case) AS ?cases) WHERE {\n  GRAPH ?g {\n' + where +
      '    ?case cac:hasStep ?ev . ?ev cac:usesChannel ?platform . ?platform rdfs:label ?label .\n  }\n  ' + PRESS + '\n} GROUP BY ?label ORDER BY DESC(?cases) LIMIT 30' };

    if (count && (state || tip || plats.length || ags.length)) return { casesSparql: casesQ, how: 'Template: count of matching cases' + (desc ? ' (' + desc + ')' : ''), sparql: PREFIXES +
      'SELECT (COUNT(DISTINCT ?case) AS ?cases) WHERE {\n  GRAPH ?g {\n' + where + '  }\n  ' + PRESS + '\n}' };

    if (state || tip || plats.length || ags.length) return { casesSparql: casesQ, how: 'Template: matching cases with their platforms' + (desc ? ' (' + desc + ')' : ''), sparql: PREFIXES +
      'SELECT ?caseId (GROUP_CONCAT(DISTINCT ?label; separator=", ") AS ?platforms) WHERE {\n  GRAPH ?g {\n' + where +
      '    OPTIONAL { ?case cac:hasStep ?ev . ?ev cac:usesChannel ?platform . ?platform rdfs:label ?label }\n  }\n  ' + PRESS + '\n} GROUP BY ?caseId ORDER BY ?caseId LIMIT 50' };

    return null;
  }

  var SCHEMA_HINT = '\n\nSchema notes for this store: a CyberTip step is `?case cac:hasStep ?tip . ?tip a <https://cacontology.projectvic.org/us/ncmec#NCMECCybertipReport>` (there is no cac:CyberTip class). Platforms: `?case cac:hasStep ?e . ?e cac:usesChannel ?platform . ?platform rdfs:label ?label`, platform IRIs are https://w3id.org/caselinker/resource/platform/{slug} (e.g. snapchat, kik, discord, social-media). Locations: `?case dcterms:spatial <https://w3id.org/caselinker/resource/location/{state}-{abbr}>` e.g. maryland-md, texas-tx. Agencies: `?case cac-multi:involvesAgency ?a . ?a rdfs:label ?l`; agency IRIs are https://w3id.org/caselinker/resource/agency/{slug} (fbi, hsi, ncmec, icac, usao, usms, cbp, plus local departments like bayonne-police-department-nj); rdfs:label is the full name (e.g. "Federal Bureau of Investigation") and acronyms are skos:altLabel, so match a named agency by IRI, never by a literal acronym label. Case ids are dcterms:identifier on cac:CACInvestigation. Always wrap patterns in GRAPH ?g and exclude provenance graphs with FILTER(STRSTARTS(STR(?g),"https://w3id.org/caselinker/resource/case/") && !STRENDS(STR(?g),"/provenance")). Provenance quotes live in GRAPH <case-iri/provenance> as oa:Annotation with dcterms:subject in {age,date,sentence,investigation_type}, prov:value, oa:hasTarget/oa:hasSelector with oa:exact and oa:start/oa:end.';

  /* ---------- examples ---------- */
  var EXAMPLES = [
    'Which platform did the CyberTip in Maryland case doj_safe_childhood_2024_480 come from, and which source passage supports it?',
    'Which Florida cases started with a CyberTip, and what platforms appear in them?',
    'Which agencies appear most often in Texas cases involving Kik?',
    'How old were the defendants in nj_ag_2017_001?',
    'How many cases involve both Snapchat and Discord?'
  ];
  EXAMPLES.forEach(function (ex) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = ex;
    b.addEventListener('click', function () { $('q').value = ex; ask(); });
    $('examples').appendChild(b);
  });

  /* ---------- run ---------- */
  var lastEvidenceCase = null, lastKind = null, lastCasesSparql = null, lastField = null;
  function show(id, on) { $(id).hidden = !on; }
  function status(el, html) { el.innerHTML = html; }

  function ask() {
    var q = $('q').value.trim(); if (!q) return;
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
    show('s-query', false); show('s-answer', false); show('s-evidence', false);
    var t = build(q);
    show('s-query', true);
    if (t) {
      $('query-how').innerHTML = CL.esc(t.how) + ' <span class="pill-src">template</span>';
      $('sparql').value = t.sparql; lastEvidenceCase = t.evidenceCase || null; lastKind = t.kind || null; lastField = t.field || null; lastCasesSparql = t.casesSparql || null;
      return run();
    }
    $('query-how').innerHTML = 'No template matched; asking the language model to write SPARQL. <span class="pill-src">Groq</span>';
    $('sparql').value = ''; lastEvidenceCase = findCase(q); lastKind = null; lastCasesSparql = null;
    status($('query-status'), '<span class="cl-spinner"></span> translating…');
    CL.fetch('/api/sparql/from-nl', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q + SCHEMA_HINT }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail || d)); return d; }); })
      .then(function (d) {
        $('sparql').value = d.sparql; $('query-how').innerHTML = 'Written by the language model and validated as read-only. <span class="pill-src">' + CL.esc(d.model || 'Groq') + '</span>'; $('query-details').open = true;
        run();
      })
      .catch(function (e) {
        status($('query-status'), '');
        $('query-how').innerHTML = '<span style="color:var(--danger)">Translation unavailable: ' + CL.esc(e.message) + '</span>. You can still write SPARQL below and run it.';
        $('sparql').value = PREFIXES + '\nSELECT ?caseId WHERE {\n  GRAPH ?g { ?case a cac:CACInvestigation ; dcterms:identifier ?caseId }\n  ' + PRESS + '\n} LIMIT 20';
      });
  }

  function run() {
    var sparql = $('sparql').value.trim(); if (!sparql) return;
    show('s-answer', true); show('s-evidence', false);
    $('answer').innerHTML = ''; status($('query-status'), '<span class="cl-spinner"></span> running…');
    $('open-graph').href = '/patterns?sparql=' + encodeURIComponent(lastCasesSparql || sparql);
    $('open-graph').title = lastCasesSparql ? 'Load the cases behind this answer on the graph canvas' : 'Run this query on the Graph page and load any cases it returns';
    var t0 = performance.now();
    CL.sparql(sparql).then(function (d) {
      var ms = Math.round(performance.now() - t0);
      status($('query-status'), CL.esc(ms + ' ms · ' + CL.storeLabel()));
      renderAnswer(d);
      if (lastEvidenceCase) loadEvidence(lastEvidenceCase);
      else { var ids = caseIdsIn(d); if (ids.length === 1) loadEvidence(ids[0]); }
    }).catch(function (e) {
      status($('query-status'), '');
      $('answer').innerHTML = '<div class="cl-notice cl-notice--danger">The store rejected the query: ' + CL.esc(e.message).slice(0, 600) + '</div>';
    });
  }

  function caseIdsIn(d) {
    var ids = {};
    (d.results && d.results.bindings || []).forEach(function (row) {
      Object.keys(row).forEach(function (k) {
        var v = row[k].value; var id = CL.caseIdFromIri(v) || (/^[a-z]+(?:_[a-z]+)*_\d{4}_\d{3}$/.test(v) ? v : null);
        if (id) ids[id] = 1;
      });
    });
    return Object.keys(ids);
  }

  function renderAnswer(d) {
    var host = $('answer');
    if (typeof d.boolean === 'boolean') {
      $('answer-how').textContent = 'ASK query';
      host.innerHTML = '<div class="answer-kicker">' + (d.boolean ? 'Yes.' : 'No.') + '</div>';
      return;
    }
    var vars = d.head && d.head.vars || [], rows = d.results && d.results.bindings || [];
    $('answer-how').textContent = rows.length + (rows.length === 1 ? ' row' : ' rows') + ' from the store';
    if (!rows.length) { host.innerHTML = '<div class="cl-empty">No rows. The graphs do not contain a match for this pattern. Edit the query above, or try a broader question.</div>'; return; }
    var kicker = '';
    if (lastKind === 'cybertip' && lastEvidenceCase) {
      var r0 = rows[0], tipIri = r0.tip && r0.tip.value, reporter = r0.reporterLabel && r0.reporterLabel.value, tipChan = r0.tipChannelLabel && r0.tipChannelLabel.value;
      var plats = rows.map(function (r) { return r.label && r.label.value; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; });
      if (!tipIri) kicker = '<div class="answer-kicker">No CyberTip step is recorded in <b>' + CL.esc(lastEvidenceCase) + '</b>.</div>';
      else if (tipChan) kicker = '<div class="answer-kicker">The CyberTip in <b>' + CL.esc(lastEvidenceCase) + '</b> came from <b>' + CL.esc(tipChan) + '</b>' + (reporter ? ', reported through ' + CL.esc(reporter) : '') + '.</div>';
      else kicker = '<div class="answer-kicker">The CyberTip in <b>' + CL.esc(lastEvidenceCase) + '</b>' + (reporter ? ' was filed through <b>' + CL.esc(reporter) + '</b>' : ' is recorded') + '; the graph attaches <b>no platform</b> to the tip itself.</div>' +
        '<p class="answer-note">' + (plats.length ? 'Platforms on the case\u2019s offence steps: <b>' + plats.map(CL.esc).join(', ') + '</b>. Whether one of them was the reporting platform is a question for the passages below, not for the graph.' : 'No platform is attached to any step of this case either.') + '</p>';
      if (tipIri) kicker += '<p class="answer-note cl-small"><a href="/explore?iri=' + encodeURIComponent(tipIri) + '" class="cl-id">' + CL.esc(tipIri.slice(RES.length)) + '</a></p>';
    }
    else if (lastKind === 'field' && lastEvidenceCase) {
      var vals = [], seen = {};
      rows.forEach(function (r) { var v = r.value && r.value.value; if (v == null) return; var k = String(v).toLowerCase().replace(/\s+/g, ' ').trim(); if (!seen[k]) { seen[k] = 1; vals.push(String(v).replace(/\b([A-Z])([a-z]+)\b/g, function (m, a, b) { return /^(Years?|Months?|Days?|Life|Prison)$/.test(m) ? m.toLowerCase() : m; })); } });
      var spans = {}; rows.forEach(function (r) { if (r.start) spans[r.start.value] = 1; });
      var n = Object.keys(spans).length;
      host.innerHTML = '<div class="answer-kicker">' + (vals.length ? vals.map(function (v) { return '<b>' + CL.esc(v) + '</b>'; }).join(', ') : 'Nothing recorded') + '</div>' +
        '<p class="answer-note">' + CL.esc(lastField === 'age' ? 'Ages' : lastField === 'sentence' ? 'Sentences' : 'Dates') + ' recorded for <b>' + CL.esc(lastEvidenceCase) + '</b>: ' + vals.length + ' distinct value' + (vals.length === 1 ? '' : 's') + ' from ' + n + ' passage' + (n === 1 ? '' : 's') + '. Open Passages to read them.</p>';
      return;
    }
    else if (lastKind === 'case' && lastEvidenceCase) {
      var groups = {};
      rows.forEach(function (r) { var k = r.kind.value, l = r.label.value; (groups[k] = groups[k] || []); if (groups[k].indexOf(l) < 0) groups[k].push(l); });
      var order = ['source', 'location', 'agency', 'platform', 'step'];
      host.innerHTML = '<div class="answer-kicker"><b>' + CL.esc(lastEvidenceCase) + '</b></div><div class="case-sum">' + order.filter(function (k) { return groups[k]; }).map(function (k) {
        return '<div class="case-sum__row"><div class="case-sum__k">' + CL.esc(k === 'step' ? 'steps' : k === 'source' ? 'source' : k + (groups[k].length === 1 ? '' : 's')) + '</div><div class="case-sum__v">' + groups[k].map(function (l) { return '<span class="cl-chip">' + CL.esc(l) + '</span>'; }).join('') + '</div></div>';
      }).join('') + '</div>';
      return;
    }
    else if (rows.length === 1 && vars.length === 1 && /^\d+$/.test(rows[0][vars[0]].value)) kicker = '<div class="answer-kicker"><b>' + CL.fmt(+rows[0][vars[0]].value) + '</b> ' + CL.esc(vars[0]) + '</div>';
    else if (vars.indexOf('label') >= 0 && rows.length <= 12 && lastEvidenceCase) kicker = '<div class="answer-kicker">' + rows.map(function (r) { return '<b>' + CL.esc(r.label.value) + '</b>'; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ') + '</div>';
    var ids = caseIdsIn(d);
    var table = '<div class="result-wrap"><table class="cl-table"><thead><tr>' + vars.map(function (v) { return '<th>' + CL.esc(v) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (row) { return '<tr>' + vars.map(function (v) { return '<td' + (row[v] && row[v].datatype && /integer|decimal|double/.test(row[v].datatype) ? ' class="num"' : '') + '>' + cell(row[v]) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
    host.innerHTML = kicker + table + (ids.length > 1 ? '<p class="cl-small cl-muted" style="margin-top:10px">' + ids.length + ' cases in this answer. Click a case id to see its passages.</p>' : '');
    Array.prototype.forEach.call(host.querySelectorAll('button[data-ev]'), function (b) {
      b.addEventListener('click', function () { Array.prototype.forEach.call(host.querySelectorAll('button[data-ev]'), function (x) { x.classList.remove('is-on'); }); b.classList.add('is-on'); loadEvidence(b.getAttribute('data-ev'), true); $('s-evidence').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    });
  }
  function cell(term) {
    if (!term) return '<span class="cl-muted">—</span>';
    var v = term.value;
    if (term.type === 'uri') {
      var id = CL.caseIdFromIri(v);
      if (id && /\/case\/[^\/]+$/.test(v)) return '<button type="button" class="case" data-ev="' + CL.esc(id) + '">' + CL.esc(id) + '</button>' + tools(id);
      if (v.indexOf(RES) === 0) return '<a href="/explore?iri=' + encodeURIComponent(v) + '" class="cl-id">' + CL.esc(v.slice(RES.length)) + '</a>';
      if (/cacontology\.projectvic\.org|unifiedcyberontology\.org|caseontology\.org|purl\.org\/dc|w3\.org\/(ns|2000|1999|2004)/.test(v)) return '<a href="' + CL.esc(v) + '" class="cl-id" rel="noopener" title="' + CL.esc(v) + '">' + CL.esc(v.split(/[#\/]/).pop()) + '</a>';
      return '<a href="' + CL.esc(v) + '" rel="noopener">' + CL.esc(v.replace(/^https?:\/\//, '').slice(0, 72)) + (v.length > 80 ? '…' : '') + '</a>';
    }
    if (/^[a-z]+(?:_[a-z]+)*_\d{4}_\d{3}$/.test(v)) return '<button type="button" class="case" data-ev="' + CL.esc(v) + '">' + CL.esc(v) + '</button>' + tools(v);
    return CL.esc(v);
  }
  function tools(id) {
    return '<span class="rowtools"><a href="/explore?case=' + encodeURIComponent(id) + '">explore</a><a href="/audit?case=' + encodeURIComponent(id) + '">audit</a></span>';
  }

  /* ---------- evidence ---------- */
  var evidenceFile = null;
  function platformEvidence() {
    if (evidenceFile) return evidenceFile;
    evidenceFile = fetch('/ontology/platform-affordance-evidence/platform_affordance_evidence.json').then(function (r) { return r.ok ? r.json() : { records: [] }; }).catch(function () { return { records: [] }; });
    return evidenceFile;
  }
  function loadEvidence(id, openIt) {
    show('s-evidence', true);
    $('evidence-details').open = !!openIt;
    $('evidence-summary').textContent = 'Show passages for ' + id;
    var host = $('evidence');
    host.innerHTML = '<div class="status"><span class="cl-spinner"></span> reading provenance graph for ' + CL.esc(id) + '…</div>';
    var provQ = 'PREFIX oa: <http://www.w3.org/ns/oa#>\nPREFIX dcterms: <http://purl.org/dc/terms/>\nPREFIX prov: <http://www.w3.org/ns/prov#>\nPREFIX cacc: <https://cacontology.projectvic.org/core#>\nPREFIX clp: <https://w3id.org/caselinker/ns/provenance#>\n' +
      'SELECT ?a ?subject ?value ?exact ?start ?end ?conf ?method ?role WHERE { GRAPH <' + caseIri(id) + '/provenance> {\n' +
      '  ?a a oa:Annotation ; dcterms:subject ?subject ; prov:value ?value ; oa:hasTarget ?t .\n' +
      '  ?t oa:hasSelector ?q . ?q oa:exact ?exact . ?t oa:hasSelector ?p . ?p oa:start ?start ; oa:end ?end .\n' +
      '  OPTIONAL { ?a cacc:hasConfidence ?conf } OPTIONAL { ?a cacc:usesMethod ?method } OPTIONAL { ?a clp:assertionRole ?role } } }\nORDER BY ?start LIMIT 300';
    Promise.all([CL.sparql(provQ).catch(function (e) { return { error: e.message }; }), platformEvidence()]).then(function (res) {
      var prov = res[0], ev = res[1];
      var recs = (ev.records || []).filter(function (r) { return r.case_id === id && r.evidence_quote; });
      var rows = (prov.results && prov.results.bindings) || [];
      var spans = [];
      var html = '<div class="ev-head"><span class="cl-id">' + CL.esc(id) + '</span></div>';
      if (recs.length) {
        html += '<div class="ev-group"><h4>Platform mentions <span class="cl-chip cl-chip--line">' + recs.length + '</span></h4>' +
          recs.sort(function (a, b) { return ({ stated: 0, inferred: 1 }[a.stated_vs_inferred] || 2) - ({ stated: 0, inferred: 1 }[b.stated_vs_inferred] || 2); }).map(function (r, i) {
            var sid = 'pf' + i; spans.push({ id: sid, quote: r.evidence_quote, label: 'platform ' + r.platform });
            return '<div class="ev-item" data-span="' + sid + '"><div><blockquote class="cl-quote">' + CL.esc(r.evidence_quote) + '</blockquote>' +
              '<div class="ev-value">platform <code>' + CL.esc(r.platform) + '</code>' + (r.platform_role_in_offense ? ' · role: ' + CL.esc(r.platform_role_in_offense) : '') + '</div></div>' +
              '<div class="ev-meta"><b>' + CL.esc(r.stated_vs_inferred) + '</b><br>' + CL.esc(r.platform_type || '') + '</div></div>';
          }).join('') + '</div>';
      }
      if (prov.error) html += '<div class="cl-notice cl-notice--warn">Provenance graph unavailable: ' + CL.esc(prov.error) + '</div>';
      else if (rows.length) {
        var groups = {};
        rows.forEach(function (r) { var s = r.subject.value; (groups[s] = groups[s] || []).push(r); });
        ['investigation_type', 'sentence', 'age', 'date'].concat(Object.keys(groups)).filter(function (k, i, a) { return groups[k] && a.indexOf(k) === i; }).forEach(function (s) {
          var seen = {};
          var items = groups[s].filter(function (r) { var k = r.start.value + ':' + r.value.value; if (seen[k]) return false; seen[k] = 1; return true; });
          html += '<div class="ev-group"><h4>' + CL.esc(s.replace('_', ' ')) + ' <span class="cl-chip cl-chip--line">' + items.length + '</span></h4>' + items.map(function (r) {
            var m = r.method ? r.method.value.split('/').pop() : '';
            var sid = r.a.value.split('/').slice(-2).join('-'); spans.push({ id: sid, quote: r.exact.value, start: +r.start.value, end: +r.end.value, label: s.replace('_', ' ') + ' ' + r.value.value });
            return '<div class="ev-item" data-span="' + CL.esc(sid) + '"><div><blockquote class="cl-quote">' + CL.esc(r.exact.value) + '</blockquote><div class="ev-value">value <code>' + CL.esc(r.value.value) + '</code>' + (r.role ? ' · ' + CL.esc(r.role.value) : '') + '</div></div>' +
              '<div class="ev-meta"><b>' + CL.esc(m) + '</b>' + (r.conf ? ' · ' + CL.esc(r.conf.value) : '') + '<br>chars ' + CL.esc(r.start.value) + '–' + CL.esc(r.end.value) + '<br><a href="/explore?iri=' + encodeURIComponent(r.a.value) + '">annotation</a></div></div>';
          }).join('') + '</div>';
        });
      } else if (!recs.length) html += '<div class="cl-empty">No stored passages for this case yet.</div>';
      host.innerHTML = html;
      $('evidence-summary').textContent = ($('evidence-details').open ? 'Hide' : 'Show') + ' ' + (spans.length ? spans.length + ' passage' + (spans.length === 1 ? '' : 's') : 'passages') + ' for ' + id;
      wireEvidence(host, id, spans);
    });
  }

  function wireEvidence(host, id, spans) {
    var list = CL.el('div', { class: 'ev-list' });
    while (host.firstChild) list.appendChild(host.firstChild);
    var panel = CL.narrativePanel({ caseId: id, spans: spans, title: 'Released text', onReady: function (p) {
      Array.prototype.forEach.call(p.querySelectorAll('mark.cl-mark'), function (m) {
        m.addEventListener('click', function () { select(m.getAttribute('data-span'), true); });
      });
    } });
    var layout = CL.el('div', { class: 'ev-layout' }, [list, panel]);
    host.appendChild(layout);
    function select(sid, fromText) {
      Array.prototype.forEach.call(list.querySelectorAll('.ev-item.is-on'), function (x) { x.classList.remove('is-on'); });
      var item = list.querySelector('.ev-item[data-span="' + sid + '"]');
      if (item) { item.classList.add('is-on'); if (fromText) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      if (!fromText) panel.jump(sid); else { var m = panel.querySelector('#mk-' + CSS.escape(sid)); Array.prototype.forEach.call(panel.querySelectorAll('mark.is-on'), function (x) { x.classList.remove('is-on'); }); if (m) m.classList.add('is-on'); }
    }
    Array.prototype.forEach.call(list.querySelectorAll('.ev-item[data-span]'), function (it) {
      it.addEventListener('click', function (e) { if (e.target.closest('a')) return; select(it.getAttribute('data-span'), false); });
    });
  }

  $('evidence-details').addEventListener('toggle', function () {
    var t = $('evidence-summary').textContent; $('evidence-summary').textContent = $('evidence-details').open ? t.replace(/^Show/, 'Hide') : t.replace(/^Hide/, 'Show');
  });

  /* ---------- wiring ---------- */
  $('ask').addEventListener('click', ask);
  $('run').addEventListener('click', function () { lastEvidenceCase = findCase($('sparql').value) || lastEvidenceCase; lastKind = null; lastCasesSparql = null; run(); });
  $('copy-sparql').addEventListener('click', function () { CL.copy($('sparql').value, 'SPARQL copied'); });
  $('q').addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); ask(); } });
  $('q').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(220, this.scrollHeight) + 'px'; });
  document.addEventListener('DOMContentLoaded', function () {
    var q = CL.qs('q');
    if (q) { $('q').value = q; ask(); }
  });
})();
</script>
</body>
</html>
