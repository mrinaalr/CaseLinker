<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affordances · CaseLinker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/viz-assets/v4.css?v=4.1">
  <script src="/viz-assets/caselinker-api.js"></script>
  <script src="/viz-assets/v4.js?v=4.2" defer></script>
  <style>
    :root {
      --lane-distribution: #5b5fc7;
      --lane-storage: #7c5cbf;
      --lane-community: #8f4fb5;
      --lane-discovery: #b7791f;
      --lane-messaging: #c25a2a;
      --lane-production: #b4302b;
    }

    .pf-stats { margin: 0 0 20px; }
    .pf-toolbar { margin: 0 0 18px; }
    .pf-toolbar .pf-search { flex: 1 1 220px; max-width: 320px; }
    .pf-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
    .pf-toggle input { margin: 0; accent-color: var(--ink); }
    .pf-toolbar .pf-count { margin-left: auto; }

    .pf-status { margin: 0 0 18px; }
    .pf-status[hidden] { display: none; }

    /* ---------- Board + detail ---------- */
    .pf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
    @media (max-width: 1080px) { .pf-layout { grid-template-columns: 1fr; } }

    /* Parchment: a warm, slightly uneven paper tone behind the lanes, no colour cast. */
    .pf-board { overflow: hidden; background-color: #fbf8f1;
      background-image:
        radial-gradient(900px 420px at 18% 0%, rgba(214,196,160,.22), transparent 70%),
        radial-gradient(700px 520px at 92% 100%, rgba(214,196,160,.18), transparent 70%),
        linear-gradient(180deg, rgba(255,253,247,.6), rgba(243,237,224,.35));
      border-color: #e2d9c4; }
    .pf-lane { background: transparent; }
    .pf-lane + .pf-lane { border-top-color: rgba(190,172,132,.35); }
    .pf-board-wrap { min-width: 0; }
    .pf-board-title { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 2px; }
    .pf-lane {
      display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px;
      padding: 14px 18px 14px 15px; border-bottom: 1px solid var(--line);
      border-left: 3px solid var(--lane-color, var(--line-2));
    }
    .pf-lane:last-child { border-bottom: 0; }
    .pf-lane__label { min-width: 0; }
    .pf-lane__name { display: block; font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: .005em; }
    .pf-lane__hint { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
    .pf-lane__body { display: flex; flex-wrap: wrap; gap: 6px 8px; align-content: flex-start; min-width: 0; }
    .pf-lane__none { font-size: 12.5px; color: var(--ink-4); align-self: center; padding: 6px 0; }
    @media (max-width: 640px) {
      .pf-lane { grid-template-columns: 1fr; gap: 8px; padding: 12px 14px 12px 11px; }
    }

    .pf-node {
      position: relative; display: block; width: 156px; max-width: 100%;
      padding: 7px 10px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); text-align: left; cursor: pointer;
      transition: border-color .15s var(--ease), background .15s var(--ease);
    }
    .pf-node:hover { border-color: var(--ink-4); background: #fcfbf9; }
    .pf-node[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -1px; border-color: var(--ink); }
    .pf-node__row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .pf-node__name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .pf-node__n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
    .pf-node__meta { display: block; font-size: 11px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pf-node__track { height: 3px; margin-top: 7px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .pf-node__fill { height: 100%; background: var(--lane-color, var(--accent)); opacity: .7; border-radius: 2px; }
    .pf-node--analysed .pf-node__name::after {
      content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--ok); margin-left: 6px; vertical-align: 2px;
    }
    .pf-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
    .pf-legend .cl-dot { color: var(--ok); width: 5px; height: 5px; }

    /* ---------- Detail panel ---------- */
    .pf-detail { position: sticky; top: calc(var(--nav-h) + 16px); max-height: calc(100vh - var(--nav-h) - 32px); display: flex; flex-direction: column; overflow: hidden; }
    @media (max-width: 1080px) { .pf-detail { position: static; max-height: none; } }
    .pf-detail__head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .pf-detail__title { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: -.015em; }
    .pf-detail__type { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
    .pf-detail__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .pf-chip-lane { border-left: 3px solid var(--lane-color, var(--line-2)); border-radius: 4px 999px 999px 4px; padding-left: 7px; }
    .pf-tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .pf-tabs::-webkit-scrollbar { display: none; }
    .pf-tab {
      border: 0; background: transparent; padding: 10px 8px 9px; font-size: 13px; font-weight: 500; color: var(--ink-3);
      cursor: pointer; position: relative; white-space: nowrap;
    }
    .pf-tab:hover { color: var(--ink); }
    .pf-tab[aria-selected="true"] { color: var(--ink); }
    .pf-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--ink); }
    .pf-tab__n { font-family: var(--mono); font-size: 11px; color: var(--ink-4); margin-left: 4px; }
    .pf-detail__body { padding: 16px 20px 20px; overflow-y: auto; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; }
    /* the panel's inner wrapper must be allowed to shrink, or the body can never scroll */
    .pf-detail > div:not(.pf-detail__head) { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    .pf-section[hidden] { display: none; }
    .pf-harm { list-style: none; margin: 0; padding: 0; }
    .pf-harm li { padding: 9px 0 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; position: relative; }
    .pf-harm li:last-child { border-bottom: 0; }
    .pf-harm li::before { content: ""; position: absolute; left: 0; top: 17px; width: 5px; height: 5px; border-radius: 50%; background: var(--lane-color, var(--ink-4)); opacity: .8; }
    .pf-author { margin-top: 12px; }

    .pf-ev { list-style: none; margin: 0; padding: 0; }
    .pf-ev > li { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .pf-ev > li:first-child { padding-top: 4px; }
    .pf-ev > li:last-child { border-bottom: 0; }
    .pf-ev .cl-quote { font-size: 15px; }
    .pf-ev__row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; padding-left: 16px; font-size: 12.5px; }
    .pf-ev__row a.cl-id { color: var(--accent); }
    .pf-ev__role { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; padding-left: 16px; }
    .pf-ev__more { margin-top: 14px; width: 100%; }
    .pf-ev__sum { margin: 0 0 8px; }

  </style>
</head>
<body>
  <div id="cl-nav" data-active="platforms"></div>

  <div class="cl-page cl-page--wide">
    <header class="cl-head">
      <h1 class="cl-title">Platform affordances</h1>
    </header>

    <div id="status" class="cl-notice pf-status" role="status"><span class="cl-spinner" aria-hidden="true"></span><span id="status-text">Loading platform evidence…</span></div>

    <div class="cl-stats pf-stats" id="stats" hidden></div>

    <div class="cl-toolbar pf-toolbar" id="toolbar" hidden>
      <input type="search" id="search" class="cl-input pf-search" placeholder="Filter platforms…" autocomplete="off" aria-label="Filter platforms">
      <div class="cl-seg" id="tier-filters" role="group" aria-label="Evidence tier">
        <button type="button" class="tier-btn" data-tier="all" aria-pressed="true">All</button>
        <button type="button" class="tier-btn" data-tier="stated" aria-pressed="false">Stated</button>
        <button type="button" class="tier-btn" data-tier="inferred" aria-pressed="false">Inferred</button>
        <button type="button" class="tier-btn" data-tier="named_only" aria-pressed="false">Named only</button>
      </div>
      <label class="pf-toggle"><input type="checkbox" id="analyzed-only"> Analysed only</label>
      <span class="pf-legend pf-count"><span class="cl-dot" aria-hidden="true"></span><span id="shown-count"></span></span>
    </div>

    <div class="pf-layout" id="layout" hidden>
      <div class="pf-board-wrap"><div class="pf-board-title">Exploitation lifecycle · where platforms live</div>
      <section class="cl-card pf-board" id="lanes" aria-label="Platforms by lifecycle lane"></section></div>

      <aside class="cl-card pf-detail" id="detail-panel" aria-live="polite">
        <div class="cl-empty" id="detail-empty">Select a platform to see its affordances, misuse surface, harm vectors and case evidence.</div>
        <div id="detail-content" hidden></div>
      </aside>
    </div>
  </div>

  <script>
    const LIFECYCLE_LANES = [
      {
        id: "production",
        label: "Production · Coercion · Ephemeral",
        hint: "Real-time capture, disappearing media, synthetic abuse",
        color: "var(--lane-production)",
      },
      {
        id: "messaging",
        label: "Private Messaging",
        hint: "Encrypted DMs, anonymity, account churn",
        color: "var(--lane-messaging)",
      },
      {
        id: "discovery",
        label: "Discovery & Contact",
        hint: "Public profiles, algorithmic reach, initial grooming",
        color: "var(--lane-discovery)",
      },
      {
        id: "community",
        label: "Closed Communities",
        hint: "Servers, groups, invite-gated spaces",
        color: "var(--lane-community)",
      },
      {
        id: "storage",
        label: "Storage & Hosting",
        hint: "Cloud accounts, archival, large collections",
        color: "var(--lane-storage)",
      },
      {
        id: "distribution",
        label: "Distribution & Trading",
        hint: "P2P, dark web, file-sharing at scale",
        color: "var(--lane-distribution)",
      },
    ];

    const TYPE_SURFACE = {
      MessagingService: "Messaging",
      SocialMediaPlatform: "Social Media",
      OnlineDatingPlatform: "Dating",
      FileHostingService: "File Hosting",
      FinancialTransferService: "Financial",
      P2PService: "P2P",
      AnonymizationService: "Anonymization",
      GamePlatform: "Gaming",
      AnonymousChatPlatform: "Anonymous Chat",
      VideoStreamingPlatform: "Video Streaming",
      ClassifiedsMarketplace: "Classifieds",
      AIService: "AI Service",
      DarkWebService: "Dark Web",
      Unknown: "Other",
    };

    const TYPE_DEFAULT_LANE = {
      MessagingService: "messaging",
      SocialMediaPlatform: "discovery",
      OnlineDatingPlatform: "discovery",
      FileHostingService: "storage",
      FinancialTransferService: "storage",
      P2PService: "distribution",
      AnonymizationService: "distribution",
      GamePlatform: "discovery",
      AnonymousChatPlatform: "discovery",
      VideoStreamingPlatform: "production",
      ClassifiedsMarketplace: "discovery",
      AIService: "production",
      DarkWebService: "distribution",
      Unknown: "discovery",
    };

    const PLATFORM_LANE = {
      Snapchat: "production",
      "Gen AI": "production",
      "Webcam platform": "production",
      Kik: "messaging",
      WhatsApp: "messaging",
      Telegram: "messaging",
      Signal: "messaging",
      Wickr: "messaging",
      Skype: "messaging",
      chat: "messaging",
      Discord: "community",
      Reddit: "community",
      IRC: "community",
      Facebook: "discovery",
      Instagram: "discovery",
      TikTok: "discovery",
      "Twitter / X": "discovery",
      "social media": "discovery",
      Roblox: "discovery",
      Omegle: "discovery",
      Whisper: "discovery",
      Craigslist: "discovery",
      YouTube: "discovery",
      "Facebook Messenger": "messaging",
      Dropbox: "storage",
      "Google Drive": "storage",
      iCloud: "storage",
      OneDrive: "storage",
      "Mega.nz": "distribution",
      BitTorrent: "distribution",
      LimeWire: "distribution",
      Tor: "distribution",
      "dark web": "distribution",
      "Cash App": "storage",
    };

    const GENERIC_PLATFORMS = new Set(["chat", "social media", "gaming", "internet", "online"]);

    const TIER_LABEL = { stated: "stated", inferred: "inferred", named_only: "named only" };
    const TIER_CHIP = { stated: "cl-chip--accent", inferred: "cl-chip--warn", named_only: "cl-chip--line" };

    const state = {
      evidence: null,
      harm: {},
      platforms: [],
      selected: null,
      tier: "all",
      search: "",
      analyzedOnly: false,
      evidenceLimit: 12,
      activeTab: null,
    };

    function el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) {
        Object.entries(attrs).forEach(([k, v]) => {
          if (v == null) return;
          if (k === "className") n.className = v;
          else if (k === "textContent") n.textContent = v;
          else if (k === "innerHTML") n.innerHTML = v;
          else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
          else n.setAttribute(k, v);
        });
      }
      (children || []).forEach((c) => {
        if (c == null) return;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return n;
    }

    function fmt(n) { return (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US"); }

    function harmLines(value) {
      if (Array.isArray(value)) return value.map((s) => String(s).trim()).filter((s) => s && s !== " ");
      if (typeof value === "string") return value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
      return [];
    }

    function hasResearcherAnalysis(platform, harmData) {
      const raw = (harmData || state.harm)[platform];
      if (!raw || typeof raw !== "object") return false;
      if (raw.analysis_author !== "researcher") return false;
      return (
        harmLines(raw.affordances).length > 0 ||
        harmLines(raw.misuse_surface).length > 0 ||
        harmLines(raw.harm_vector).length > 0
      );
    }

    function laneForPlatform(platform, platformType) {
      if (PLATFORM_LANE[platform]) return PLATFORM_LANE[platform];
      return TYPE_DEFAULT_LANE[platformType] || "discovery";
    }

    function buildPlatforms(evidence, harm) {
      const records = evidence.records || [];
      const byPlatform = new Map();

      for (const rec of records) {
        const platform = rec.platform;
        if (!platform) continue;
        const tier = rec.stated_vs_inferred;
        if (!["stated", "inferred", "named_only"].includes(tier)) continue;

        if (!byPlatform.has(platform)) {
          byPlatform.set(platform, {
            platform,
            platform_type: rec.platform_type || "Unknown",
            tier_counts: { stated: 0, inferred: 0, named_only: 0 },
            records: [],
          });
        }
        const row = byPlatform.get(platform);
        row.tier_counts[tier] += 1;
        row.records.push(rec);
      }

      const platforms = [];
      for (const row of byPlatform.values()) {
        const total =
          row.tier_counts.stated + row.tier_counts.inferred + row.tier_counts.named_only;
        platforms.push({
          ...row,
          total,
          lane: laneForPlatform(row.platform, row.platform_type),
          surface: TYPE_SURFACE[row.platform_type] || row.platform_type,
          researcherAnalyzed: hasResearcherAnalysis(row.platform, harm),
        });
      }

      platforms.sort((a, b) => {
        const aGen = GENERIC_PLATFORMS.has(a.platform);
        const bGen = GENERIC_PLATFORMS.has(b.platform);
        if (aGen !== bGen) return aGen ? 1 : -1;
        return b.tier_counts.stated - a.tier_counts.stated || b.total - a.total;
      });

      return platforms;
    }

    function countForTier(p, tier) {
      if (tier === "all") return p.total;
      return p.tier_counts[tier] || 0;
    }

    function filteredPlatforms() {
      const q = state.search.trim().toLowerCase();
      return state.platforms.filter((p) => {
        if (state.analyzedOnly && !p.researcherAnalyzed) return false;
        if (q && !p.platform.toLowerCase().includes(q)) return false;
        if (state.tier !== "all" && countForTier(p, state.tier) === 0) return false;
        return true;
      });
    }

    function maxBarCount(list) {
      let m = 1;
      for (const p of list) {
        const c = state.tier === "all" ? p.tier_counts.stated : countForTier(p, state.tier);
        if (c > m) m = c;
      }
      return m;
    }

    /* ---------- Rendering ---------- */
    function renderStats() {
      const meta = (state.evidence && state.evidence._meta) || {};
      const analyzed = state.platforms.filter((p) => p.researcherAnalyzed).length;
      const records = (state.evidence && state.evidence.records) || [];
      const strip = document.getElementById("stats");
      strip.innerHTML = "";
      [
        { val: meta.cases_processed, lbl: "Cases processed" },
        { val: state.platforms.length, lbl: "Platforms" },
        { val: analyzed, lbl: "Researcher-analysed platforms" },
        { val: records.length, lbl: "Case–platform pairs" },
      ].forEach(({ val, lbl }) => {
        strip.appendChild(
          el("div", { className: "cl-stat" }, [
            el("div", { className: "cl-stat__n", textContent: fmt(val) }),
            el("div", { className: "cl-stat__l", textContent: lbl }),
          ])
        );
      });
      strip.hidden = false;
    }

    function renderLanes() {
      const wrap = document.getElementById("lanes");
      wrap.innerHTML = "";

      const list = filteredPlatforms();
      const maxCount = maxBarCount(list);
      const analysed = list.filter((p) => p.researcherAnalyzed).length;
      document.getElementById("shown-count").textContent =
        fmt(list.length) + " of " + fmt(state.platforms.length) + " platforms shown · dot = researcher analysis (" + fmt(analysed) + ")";

      LIFECYCLE_LANES.forEach((lane) => {
        const lanePlatforms = list.filter((p) => p.lane === lane.id);
        const laneEl = el("div", { className: "pf-lane", "data-lane": lane.id });
        laneEl.style.setProperty("--lane-color", lane.color);

        const label = el("div", { className: "pf-lane__label" }, [
          el("span", { className: "pf-lane__name", textContent: lane.label }),
          el("span", { className: "pf-lane__hint", textContent: lane.hint }),
        ]);

        const body = el("div", { className: "pf-lane__body" });
        if (!lanePlatforms.length) {
          body.appendChild(el("span", { className: "pf-lane__none", textContent: "No platforms match the current filters." }));
        } else {
          lanePlatforms.forEach((p) => body.appendChild(renderPlatformNode(p, lane, maxCount)));
        }

        laneEl.appendChild(label);
        laneEl.appendChild(body);
        wrap.appendChild(laneEl);
      });
    }

    function renderPlatformNode(p, lane, maxCount) {
      const displayCount =
        state.tier === "all" ? p.tier_counts.stated : countForTier(p, state.tier);
      const pct = Math.max(8, Math.round((displayCount / maxCount) * 100));
      const tierWord = state.tier === "all" ? "stated" : TIER_LABEL[state.tier] || state.tier;

      const btn = el("button", {
        type: "button",
        className: "pf-node" + (p.researcherAnalyzed ? " pf-node--analysed" : ""),
        "data-platform": p.platform,
        "aria-pressed": state.selected === p.platform ? "true" : "false",
        title: p.platform + " · " + p.surface + " · " + displayCount + " " + tierWord + (p.researcherAnalyzed ? " · researcher analysis" : ""),
        onClick: () => selectPlatform(p.platform),
      });
      btn.style.setProperty("--lane-color", lane.color);

      btn.appendChild(
        el("span", { className: "pf-node__row" }, [
          el("span", { className: "pf-node__name", textContent: p.platform }),
          el("span", { className: "pf-node__n", textContent: String(displayCount) }),
        ])
      );
      btn.appendChild(el("span", { className: "pf-node__meta", textContent: p.surface + " · " + tierWord }));
      const track = el("span", { className: "pf-node__track" });
      const fill = el("span", { className: "pf-node__fill" });
      fill.style.display = "block";
      fill.style.width = pct + "%";
      track.style.display = "block";
      track.appendChild(fill);
      btn.appendChild(track);

      return btn;
    }

    function getPlatform(platformName) {
      return state.platforms.find((p) => p.platform === platformName);
    }

    function harmEntry(platform) {
      const raw = state.harm[platform];
      if (!raw) return { affordances: [], misuse_surface: [], harm_vector: [], author: null };
      return {
        affordances: harmLines(raw.affordances),
        misuse_surface: harmLines(raw.misuse_surface),
        harm_vector: harmLines(raw.harm_vector),
        author: raw.analysis_author || null,
      };
    }

    function tierFilteredRecords(p) {
      let recs = p.records.filter((r) => r.evidence_quote && r.evidence_quote.trim());
      if (state.tier !== "all") recs = recs.filter((r) => r.stated_vs_inferred === state.tier);
      const tierOrder = { stated: 0, inferred: 1, named_only: 2 };
      recs.sort((a, b) => {
        const ta = tierOrder[a.stated_vs_inferred] ?? 9;
        const tb = tierOrder[b.stated_vs_inferred] ?? 9;
        if (ta !== tb) return ta - tb;
        return (a.case_id || "").localeCompare(b.case_id || "");
      });
      return recs;
    }

    function closeDetail() {
      state.selected = null;
      history.replaceState(null, "", location.pathname);
      document.getElementById("detail-empty").hidden = false;
      document.getElementById("detail-content").hidden = true;
      renderLanes();
    }

    function selectPlatform(platformName) {
      if (state.selected === platformName) {
        closeDetail();
        return;
      }
      state.selected = platformName;
      state.evidenceLimit = 12;
      state.activeTab = null;
      const p = getPlatform(platformName);
      if (!p) return;

      history.replaceState(null, "", "?platform=" + encodeURIComponent(platformName));
      renderLanes();
      renderDetail(p);
    }

    function renderHarmList(items, laneColor, author) {
      const wrap = el("div");
      if (!items.length) {
        wrap.appendChild(el("p", { className: "cl-muted cl-small", textContent: "No harm analysis is recorded for this platform. The Evidence tab lists the case passages that name it." }));
        return wrap;
      }
      const ul = el("ul", { className: "pf-harm" });
      ul.style.setProperty("--lane-color", laneColor);
      items.forEach((text) => ul.appendChild(el("li", { textContent: text })));
      wrap.appendChild(ul);
      if (author) {
        wrap.appendChild(el("p", { className: "cl-muted cl-small pf-author", textContent: "Analysis author: " + author + "." }));
      }
      return wrap;
    }

    function renderDetail(p) {
      const empty = document.getElementById("detail-empty");
      const content = document.getElementById("detail-content");
      empty.hidden = true;
      content.hidden = false;
      content.innerHTML = "";

      const lane = LIFECYCLE_LANES.find((l) => l.id === p.lane);
      const harm = harmEntry(p.platform);
      const laneColor = lane ? lane.color : "var(--accent)";

      const head = el("div", { className: "pf-detail__head" });
      head.appendChild(el("h2", { className: "pf-detail__title", textContent: p.platform }));
      head.appendChild(el("div", { className: "pf-detail__type", textContent: p.surface + " · " + p.platform_type }));
      const chips = el("div", { className: "pf-detail__chips" });
      if (lane) {
        const chip = el("span", { className: "cl-chip pf-chip-lane", textContent: lane.label });
        chip.style.setProperty("--lane-color", lane.color);
        chips.appendChild(chip);
      }
      ["stated", "inferred", "named_only"].forEach((t) => {
        if (p.tier_counts[t]) {
          chips.appendChild(el("span", { className: "cl-chip " + TIER_CHIP[t], textContent: fmt(p.tier_counts[t]) + " " + TIER_LABEL[t] }));
        }
      });
      if (p.researcherAnalyzed) chips.appendChild(el("span", { className: "cl-chip cl-chip--ok", textContent: "researcher analysis" }));
      head.appendChild(chips);
      content.appendChild(head);

      const tabs = el("div", { className: "pf-tabs", role: "tablist" });
      const body = el("div", { className: "pf-detail__body" });
      const evidenceCount = tierFilteredRecords(p).length;
      const sections = [
        { id: "affordances", label: "Affordances", items: harm.affordances, n: harm.affordances.length },
        { id: "misuse", label: "Misuse surface", items: harm.misuse_surface, n: harm.misuse_surface.length },
        { id: "harm", label: "Harm vectors", items: harm.harm_vector, n: harm.harm_vector.length },
        { id: "evidence", label: "Evidence", items: null, n: evidenceCount },
      ];

      let activeTab = state.activeTab || "affordances";
      if (!state.activeTab && !harm.affordances.length && !harm.misuse_surface.length && !harm.harm_vector.length) {
        activeTab = "evidence";
      }

      sections.forEach((sec) => {
        const tab = el("button", {
          type: "button",
          className: "pf-tab",
          role: "tab",
          "aria-selected": sec.id === activeTab ? "true" : "false",
          "aria-controls": "section-" + sec.id,
          onClick: () => switchTab(sec.id),
        }, [
          sec.label,
          el("span", { className: "pf-tab__n", textContent: String(sec.n) }),
        ]);
        tab.dataset.tab = sec.id;
        tabs.appendChild(tab);

        const section = el("div", {
          className: "pf-section",
          id: "section-" + sec.id,
          role: "tabpanel",
        });
        section.hidden = sec.id !== activeTab;

        if (sec.id === "evidence") {
          section.appendChild(renderEvidenceSection(p));
        } else {
          section.appendChild(renderHarmList(sec.items, laneColor, harm.author));
        }
        body.appendChild(section);
      });

      content.appendChild(tabs);
      content.appendChild(body);

      function switchTab(id) {
        state.activeTab = id;
        tabs.querySelectorAll(".pf-tab").forEach((t) => {
          t.setAttribute("aria-selected", t.dataset.tab === id ? "true" : "false");
        });
        body.querySelectorAll(".pf-section").forEach((s) => {
          s.hidden = s.id !== "section-" + id;
        });
        body.scrollTop = 0;
      }
    }

    function renderEvidenceSection(p) {
      const wrap = el("div");
      const recs = tierFilteredRecords(p);
      if (!recs.length) {
        wrap.appendChild(
          el("p", {
            className: "cl-muted cl-small",
            textContent: state.tier === "all"
              ? "No quotable passage is stored for this platform."
              : "No quotable passage for this platform at the “" + (TIER_LABEL[state.tier] || state.tier) + "” tier. Switch the tier control to All to see every passage.",
          })
        );
        return wrap;
      }

      const shown = recs.slice(0, state.evidenceLimit);
      wrap.appendChild(
        el("p", {
          className: "cl-small cl-muted pf-ev__sum",
          textContent: fmt(recs.length) + " passages name this platform" + (state.tier !== "all" ? " at the " + (TIER_LABEL[state.tier] || state.tier) + " tier" : "") + ". Showing " + fmt(shown.length) + ".",
        })
      );

      const list = el("ul", { className: "pf-ev" });

      shown.forEach((rec) => {
        const tier = rec.stated_vs_inferred || "named_only";
        const item = el("li");
        item.appendChild(el("blockquote", { className: "cl-quote", textContent: rec.evidence_quote.trim() }));
        if (rec.platform_role_in_offense) {
          item.appendChild(el("div", { className: "pf-ev__role", textContent: "Role: " + rec.platform_role_in_offense }));
        }
        item.appendChild(
          el("div", { className: "pf-ev__row" }, [
            el("a", { className: "cl-id", href: "/patterns?case=" + encodeURIComponent(rec.case_id), textContent: rec.case_id }),
            el("a", { href: "/explore?case=" + encodeURIComponent(rec.case_id), textContent: "explore" }),
            el("span", { className: "cl-chip " + (TIER_CHIP[tier] || "cl-chip--line"), textContent: TIER_LABEL[tier] || tier }),
          ])
        );
        list.appendChild(item);
      });

      wrap.appendChild(list);

      if (recs.length > state.evidenceLimit) {
        const remaining = recs.length - state.evidenceLimit;
        const btn = el("button", {
          type: "button",
          className: "cl-btn cl-btn--sm pf-ev__more",
          textContent: "Show " + Math.min(20, remaining) + " more (" + fmt(remaining) + " remaining)",
          onClick: () => {
            state.evidenceLimit += 20;
            const oldBody = document.querySelector("#detail-content .pf-detail__body");
            const scrollPos = oldBody ? oldBody.scrollTop : 0;
            renderDetail(p);
            const newBody = document.querySelector("#detail-content .pf-detail__body");
            if (newBody) newBody.scrollTop = scrollPos;
          },
        });
        wrap.appendChild(btn);
      }

      return wrap;
    }

    function bindControls() {
      document.getElementById("search").addEventListener("input", (e) => {
        state.search = e.target.value;
        renderLanes();
      });

      document.getElementById("analyzed-only").addEventListener("change", (e) => {
        state.analyzedOnly = e.target.checked;
        renderLanes();
      });

      document.getElementById("tier-filters").addEventListener("click", (e) => {
        const btn = e.target.closest(".tier-btn");
        if (!btn) return;
        state.tier = btn.dataset.tier;
        document.querySelectorAll(".tier-btn").forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
        renderLanes();
        if (state.selected) {
          const p = getPlatform(state.selected);
          if (p) renderDetail(p);
        }
      });
    }

    function setStatus(kind, text) {
      const box = document.getElementById("status");
      if (!text) { box.hidden = true; return; }
      box.hidden = false;
      box.className = "cl-notice pf-status" + (kind ? " cl-notice--" + kind : "");
      box.innerHTML = "";
      if (kind === "loading") box.appendChild(el("span", { className: "cl-spinner", "aria-hidden": "true" }));
      box.appendChild(el("span", { textContent: text }));
    }

    async function loadData() {
      setStatus("loading", "Loading platform evidence…");
      try {
        const [evidenceRes, harmRes] = await Promise.all([
          fetch("/ontology/platform-affordance-evidence/platform_affordance_evidence.json", { cache: "no-store" }),
          fetch("/ontology/platform-affordance-evidence/platform_affordance_evidence_harm_analysis.json", { cache: "no-store" }),
        ]);

        if (!evidenceRes.ok) throw new Error("Q1 evidence data unavailable (" + evidenceRes.status + ")");
        const evidence = await evidenceRes.json();
        const harmRaw = harmRes.ok ? await harmRes.json() : {};
        const { _note, ...harm } = harmRaw;

        state.evidence = evidence;
        state.harm = harm;
        state.platforms = buildPlatforms(evidence, harm);

        setStatus(null, "");
        if (!state.platforms.length) {
          setStatus("warn", "The evidence file loaded but holds no platform records with a stated, inferred or named-only tier.");
        }
        if (!harmRes.ok) {
          setStatus("warn", "Harm analysis file unavailable (" + harmRes.status + "); showing evidence only. Affordance, misuse-surface and harm-vector tabs will be empty.");
        }

        renderStats();
        document.getElementById("toolbar").hidden = false;
        document.getElementById("layout").hidden = false;
        var framingEl = document.getElementById("framing"); if (framingEl) framingEl.hidden = false;
        renderLanes();
        bindControls();

        const params = new URLSearchParams(location.search);
        const platform = params.get("platform");
        if (platform && getPlatform(platform)) {
          selectPlatform(platform);
        } else if (state.platforms.find((p) => p.platform === "Snapchat")) {
          selectPlatform("Snapchat");
        }
      } catch (err) {
        setStatus("danger", "Failed to load platform harm data: " + (err.message || err) + ". Reload to try again.");
        console.error(err);
      }
    }

    loadData();
  </script>
</body>
</html>
